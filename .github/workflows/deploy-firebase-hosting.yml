name: Deploy Web to Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/views/About.vue'
      - 'src/services/prayerContentService.js'
      - 'src/utils/publicPrayerCatalog.mjs'
      - 'src/main.js'
      - 'src/utils/ordoRevalidation.js'
      - 'scripts/export-public-prayers-hosting.mjs'
      - 'firebase.json'
      - 'tests/public-prayer-catalog.test.mjs'
      - 'package.json'
      - 'src/views/LiturgyHoursDecrees.vue'
      - 'src/views/ProperCalendar.vue'
      - 'src/views/Compendium.vue'
      - 'src/views/CompendiumNode.vue'
      - 'src/views/CompendiumQuestion.vue'
      - 'src/data/documents/proper-calendar-additions.js'
      - 'src/data/documents/proper-calendar.json'
      - 'src/data/documents/liturgy-hours-decrees.json'
      - 'src/layouts/default/NavigationDrawer.vue'
      # Deploy this reader update after the reviewed PR reaches main.
      - 'src/utils/readerPreferences.js'
      # A verified content publication must refresh the Web reader cache.
      - 'src/constants/contentRevision.js'
      - 'src/components/oraparts/Reading.vue'
      - 'src/components/oraparts/Lectio.vue'
      - 'src/components/oraparts/LastPrayer.vue'
      - 'src/components/oraparts/DayTitle.vue'
      - 'src/components/OrasList.vue'
      # Publish Ordo-backed fixed celebration labels in the Hours reader.
      - 'src/utils/ordoDayOptions.js'
      - 'src/styles/main.scss'
      # Draft editor and its Firestore policy are deployed together.
      - 'src/views/admin/PrayerDraftEditor.vue'
      - 'src/views/admin/PrayerDrafts.vue'
      - 'src/utils/prayerDraftModel.mjs'
      - 'src/utils/prayerDraftActions.mjs'
      - 'src/utils/prayerSource.mjs'
      - 'src/data/sourceBibliography.json'
      - 'firestore.rules'
      - '.github/workflows/deploy-firebase-hosting.yml'

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish web
    # PR245's dispatch-only writer must finish before its cache revision is served.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[pr245-data-before-web]'))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        env:
          VITE_LAUNCH_QUOTA_GUARD: 'true'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # Public URLs (not secrets): feedback Worker API and the superadmin-only link to the analytics reports panel.
          VITE_FEEDBACK_API_URL: https://mybrev-feedback.slovo-app.workers.dev
          VITE_ANALYTICS_REPORTS_URL: https://mybrev-analytics-reports-staging.slovo-app.workers.dev/reports
        run: |
          if [ "$VITE_FIREBASE_PROJECT_ID" != "ibreviaryby" ]; then
            echo "::error::VITE_FIREBASE_PROJECT_ID must match the Hosting target ibreviaryby."
            exit 1
          fi
          npm run build

      - name: Verify build output
        run: |
          test -s dist/prayer-source-policy.json
          node --input-type=module -e "import fs from 'node:fs'; import {PRAYER_SOURCE_POLICY_VERSION} from './src/utils/prayerSource.mjs'; const p=JSON.parse(fs.readFileSync('dist/prayer-source-policy.json')); if(p.version!==PRAYER_SOURCE_POLICY_VERSION)process.exit(1)"
          test -s dist/index.html
          test -s dist/privacy.html
          grep -q "Палітыка прыватнасці" dist/privacy.html

      - name: Authenticate to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IBREVIARYBY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Set FIREBASE_SERVICE_ACCOUNT_IBREVIARYBY in GitHub Actions secrets."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      # Generate only the allowlisted public catalog from the source of truth.
      # This reads three collections ONCE per deployment, not per visitor;
      # a quota error fails the release before any Hosting changes.
      - name: Export public prayers to Hosting
        run: |
          node scripts/export-public-prayers-hosting.mjs --live --project ibreviaryby --out dist/public-prayers-v1.json
          test -s dist/public-prayers-v1.json
          node --input-type=module -e "import fs from 'node:fs'; import {validatePublicPrayerCatalog} from './src/utils/publicPrayerCatalog.mjs'; const c=JSON.parse(fs.readFileSync('dist/public-prayers-v1.json')); validatePublicPrayerCatalog(c); console.log('Public catalog verified',c.prayers.length,'prayers',c.categories.length,'categories');"

      # Publish the approved security rules BEFORE the new draft editor.
      # If rules deployment is denied, keep the existing Web release unchanged.
      - name: Deploy Firestore rules for approved draft workflow change
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-draft-rules]')
        run: npx --yes firebase-tools@latest deploy --only firestore:rules --project ibreviaryby --non-interactive

      - name: Deploy Hosting only
        run: npx --yes firebase-tools@latest deploy --only hosting --project ibreviaryby --non-interactive

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
