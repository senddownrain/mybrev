name: Firebase Hosting production release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firebase-hosting-release.yml'

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, validate catalog and deploy Hosting
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || vars.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL || vars.VITE_FIREBASE_DATABASE_URL }}
      VITE_FEEDBACK_API_URL: ${{ secrets.VITE_FEEDBACK_API_URL || vars.VITE_FEEDBACK_API_URL }}
      VITE_ENABLE_EXTENDED_CACHE_WARMUP: 'true'

    steps:
      - name: Check out exactly the main revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate production build settings
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IBREVIARYBY || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Configure FIREBASE_SERVICE_ACCOUNT_IBREVIARYBY (or FIREBASE_SERVICE_ACCOUNT) as a repository secret before deploying."
            exit 1
          fi
          for key in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID VITE_FEEDBACK_API_URL; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing production build setting: $key (repository variable or secret)."
              exit 1
            fi
          done
          if [ "$VITE_FIREBASE_PROJECT_ID" != 'ibreviaryby' ]; then
            echo "::error::Refusing deploy to unexpected Firebase web project."
            exit 1
          fi

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          project_id: ibreviaryby
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IBREVIARYBY || secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install pinned dependencies
        run: npm ci

      - name: Build production web app
        run: npm run build

      - name: Export public prayer catalog (bounded live Firestore reads, no writes)
        run: node scripts/export-public-prayers-hosting.mjs --live --project ibreviaryby --out dist/public-prayers-v1.json

      - name: Verify public catalog release gate
        run: node scripts/verify-public-prayers-hosting.mjs dist/public-prayers-v1.json

      - name: Deploy Firebase Hosting only
        run: npx --yes firebase-tools@latest deploy --only hosting --project ibreviaryby --non-interactive

      - name: Report deployed revision
        run: echo "Published Firebase Hosting from $GITHUB_SHA to project ibreviaryby"
