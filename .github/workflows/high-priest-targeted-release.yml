name: High Priest targeted content release

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'Full SHA of the reviewed main revision'
        required: true
        type: string
      mode:
        description: "Read-only check or explicitly authorized atomic publication"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: high-priest-content-release
  cancel-in-progress: false

jobs:
  targeted-content:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'senddownrain/mybrev' && github.ref == 'refs/heads/main' && inputs.approved_sha == github.sha
    name: Verify and optionally publish three Firestore documents
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate guarded single-document publication (offline)
        run: node --test tests/high-priest-targeted-release.test.mjs
      - name: Load existing production Firebase secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IBREVIARYBY }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "::error::Missing production Firebase service account"; exit 1; }
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/high-priest-firebase.json"
          node -e "const p=require(process.argv[1]); if(p.project_id!=='ibreviaryby')process.exit(2)" "$RUNNER_TEMP/high-priest-firebase.json"
          echo "HIGH_PRIEST_SERVICE_ACCOUNT=$RUNNER_TEMP/high-priest-firebase.json" >> "$GITHUB_ENV"
      - name: Read exactly three documents and check SAFE CONTENT PATCH (no writes)
        run: node scripts/content/publish-high-priest-targeted.mjs --service-account "$HIGH_PRIEST_SERVICE_ACCOUNT"
      - name: Publish approved 12-field patch and manifest atomically
        if: inputs.mode == 'apply'
        run: node scripts/content/publish-high-priest-targeted.mjs --service-account "$HIGH_PRIEST_SERVICE_ACCOUNT" --apply --approved
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/high-priest-firebase.json"

  browser-evidence:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'senddownrain/mybrev' && github.ref == 'refs/heads/main' && inputs.approved_sha == github.sha
    name: Capture real published Web hours in Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate three public Web screenshots in headless Chrome
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/smoke-high-priest-live.mjs audit-evidence/high-priest-live
      - name: Upload screenshots and browser results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: high-priest-web-screenshots
          path: audit-evidence/high-priest-live/
          retention-days: 14
          if-no-files-found: warn
