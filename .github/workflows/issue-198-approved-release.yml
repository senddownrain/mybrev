name: Issue 198 approved production repair and visual QA

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Full SHA of the reviewed commit at the tip of main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  repair-publish-verify:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'senddownrain/mybrev' && github.ref == 'refs/heads/main' && inputs.approved_sha == github.sha
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 50
    steps:
      - name: Verify the exact production ref and approved SHA
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main && "$APPROVED_SHA" == "$GITHUB_SHA" ]]

      - name: Checkout approved main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and test approved repair
        run: |
          npm ci
          node --test tests/ordinary-friday-vespers.test.mjs
          git diff --check

      - name: Load existing protected Firebase credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IBREVIARYBY }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "::error::Missing production Firebase credential"; exit 1; fi
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          node -e "const a=require(process.argv[1]);if(a.project_id!=='ibreviaryby') process.exit(2)" "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Validate isolated Flutter manifest planner (offline)
        run: node --test tests/single-day-manifest.test.mjs

      - name: Create guarded, reviewed 11-field patch from fresh live reads
        run: |
          FIREBASE_SERVICE_ACCOUNT_B64="$(base64 -w0 "$GOOGLE_APPLICATION_CREDENTIALS")" node scripts/liturgy/fix-ordinary-friday-vespers.mjs --live --out reports/liturgy/issue-198-production-plan.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('reports/liturgy/issue-198-production-plan.json','utf8'));
          const n=Object.keys(p.fields).length;
          if(n!==11 && n!==0) throw Error('Expected 11-field repair or already corrected; found '+n);
          if(p.comparison.some(x=>x.changed && !x.equalsAllSaintsFirst)) throw Error('Unrecognized source');
          console.log('Approved changes: '+n);
          NODE

      - name: Apply exact Firestore patch with update-time preconditions and readback
        run: |
          FIREBASE_SERVICE_ACCOUNT_B64="$(base64 -w0 "$GOOGLE_APPLICATION_CREDENTIALS")" node scripts/liturgy/fix-ordinary-friday-vespers.mjs --live --apply --plan reports/liturgy/issue-198-production-plan.json

      - name: Dry-run isolated Flutter manifest update (one doc, not 277)
        run: node scripts/content/publish-single-day-manifest.mjs --service-account "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Publish exactly one corrected Flutter days hash and digest
        run: node scripts/content/publish-single-day-manifest.mjs --service-account "$GOOGLE_APPLICATION_CREDENTIALS" --apply

      - name: Verify manifest is idempotent and report remaining unpublished days
        run: |
          node scripts/content/publish-single-day-manifest.mjs --service-account "$GOOGLE_APPLICATION_CREDENTIALS"
          npm run content:manifest -- --collection days --service-account "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Build Web with published content revision
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APP_CHECK_SITE_KEY }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_FEEDBACK_API_URL: https://mybrev-feedback.slovo-app.workers.dev
          VITE_ANALYTICS_REPORTS_URL: https://mybrev-analytics-reports-staging.slovo-app.workers.dev/reports
        run: |
          test "$VITE_FIREBASE_PROJECT_ID" = ibreviaryby
          npm run build
          test -s dist/index.html

      - name: Deploy Firebase Hosting
        run: npx --yes firebase-tools@15.28.1 deploy --only hosting --project ibreviaryby --non-interactive

      - name: Install Chromium for mobile and desktop visual QA
        run: npx --no-install playwright-core install --with-deps chromium

      - name: Production date screenshots and visible-content QA
        run: |
          mkdir -p reports/liturgy/issue-198-screenshots
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { chromium } from 'playwright-core';
          const base='https://ibreviaryby.web.app';
          const browser=await chromium.launch({headless:true});
          const cases=[
            ['2026-10-30','ordinary-w30-d6',false],
            ['2027-10-29','ordinary-w30-d6',false],
            ['2028-11-03','ordinary-w30-d6',false],
            ['2026-10-31','ordinary-w30-d7',true],
            ['2027-10-31','ordinary-w31-d1',true],
          ];
          const records=[];
          try {
            for(const [date,id,expectFirst] of cases){
              for(const [size,viewport] of [['mobile',{width:390,height:844}],['desktop',{width:1280,height:800}]]){
                const ctx=await browser.newContext({viewport,serviceWorkers:'block'});
                const page=await ctx.newPage();
                const url=base+'/day/'+date+'/ora/'+id+'/vesper?diocese=vitebsk';
                try {
                  await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
                  await page.locator('.liturgical-hour-column .ora-text').first().waitFor({state:'visible',timeout:60000});
                  const rubrics=await page.locator('.vespers-rubric-chip').allInnerTexts();
                  const first=rubrics.some(x=>/I Нешпары/.test(x)&&!/II Нешпары/.test(x));
                  assert.equal(first,expectFirst,date+': incorrect I Vespers rubric '+rubrics);
                  if(!expectFirst) assert.ok(!rubrics.some(x=>x.includes('Усіх Святых')),date+': All Saints rubric on Friday');
                  const body=await page.locator('.liturgical-hour-column').innerText();
                  assert.ok(body.length>1500,date+': prayer text unexpectedly short');
                  const file='reports/liturgy/issue-198-screenshots/'+date+'-'+size+'.png';
                  await page.screenshot({path:file,fullPage:true});
                  records.push({date,size,url,first,rubrics,textChars:body.length,screenshot:file});
                  console.log('PASS',date,size,rubrics.join(' | '));
                }finally {await ctx.close();}
              }
            }
          }finally {await browser.close();}
          fs.writeFileSync('reports/liturgy/issue-198-screenshots/results.json',JSON.stringify({cases:records.length,records},null,2));
          console.log('Screenshot acceptance:',records.length,'passed');
          NODE

      - name: Upload visual evidence and sanitized release reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-198-production-screenshots-and-report
          path: |
            reports/liturgy/issue-198-screenshots/
            reports/content/manifest-diff.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve private pre-write Firestore rollback copy
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-198-private-rollback
          path: backups/issue-198/
          if-no-files-found: ignore
          retention-days: 7

      - name: Erase runner credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
