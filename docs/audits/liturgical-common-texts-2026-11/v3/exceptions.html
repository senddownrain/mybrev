<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>PR245 — 10 исключений</title><style>body{font:17px/1.5 system-ui;max-width:1050px;margin:auto;padding:24px;background:#faf8f3;color:#27231d}article{background:white;border:1px solid #ddd;padding:20px;margin:24px 0}h2{font-size:19px;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere}select,textarea,button{font:inherit;padding:8px;max-width:100%}textarea{display:block;width:95%;min-height:65px}label{display:block;margin:12px 0}code{overflow-wrap:anywhere}.reply{border-top:1px solid #ddd;padding:15px 0}.source{border-left:3px solid #b3a591;padding-left:18px}button{cursor:pointer}</style><h1>Только редакционные исключения</h1><p>10 групп / 10 полей. Поля остаются без изменений. Каждый сезон показан отдельно. Кандидат дословно следует начальному ответу, включая спорное написание. Выбор сохраняется только при экспорте JSON; загрузки на сервер нет.</p><button id="export">Экспорт решений JSON</button><div id="cards"></div><script type="application/json" id="data">[{"caseId":"PR245-234","file":"patchs/feasts/29-07-sv-martha.json","field":"officeOfReadingsR2","kind":"long","status":"needs-editor","beforeHtml":"\u003cp style=\"text-align: justify;\">\u003cspan style=\"color: #ff0000;\">Другое чытанне\u003c/span>\u003cbr />Казанне св. Аўгустына, біскупа\u003cbr />\u003cspan style=\"color: #ff0000;\">(Sermo 103, 1-2. 6: PL 38, 613. 615)\u003c/span>\u003c/p>\n\u003cp style=\"text-align: center;\">\u003cem>\u003cspan style=\"color: #ff0000;\">Шчаслівыя, хто меў годнасць запрасіць Пана ў свой дом\u003c/span>\u003c/em>\u003c/p>\n\u003cp style=\"text-align: justify;\">Словы нашага Пана Езуса Хрыста нагадваюць нам, што ёсць толькі адна мэта, да якой мы ідзем сярод разнастайных спраў гэтага свету. Ідзём як вандроўнікі, а не жыхары, як тыя, хто знаходзіцца ў дарозе, а не каля мэты, як тыя, хто прагне, але яшчэ не мае. Аднак ідзем старанна і вытрывала, каб калі-небудзь дайсці да мэты.\u003c/p>\n\u003cp style=\"text-align: justify;\">Марта і Марыя былі сёстрамі. Яднала іх не толькі сваяцтва, але таксама пабожнасць. Абедзве былі адданыя Богу, абедзьве ахвотна служылі Пану, які прабываў у целе. Марыя прыняла Яго так, як звычайна прымалі падарожных. Аднак на самай справе, слуга прыняла Пана, хворая – Лекара, стварэнне – Стварыцеля. Тая, якая павінна была атрымаць духоўную ежу, прыняла, каб прапанаваць ежу для цела. Пан пажадаў прыняць постаць слугі і ў гэтай постаці – не па неабходнасці, але паводле сваёй ласкі – прымаў пасілак, прыгатаваны Яму слугамі, бо прыняцце пасілку таксама было ласкай. Як чалавек Ён адчуваў голад і смагу.\u003c/p>\n\u003cp style=\"text-align: justify;\">Пан быў прыняты як падарожнік, які прыйшоў да сваіх, і свае Яго не прынялі, а тым, хто прыняў Яго, даў уладу стаць Божымі дзецьмі (пар. Ян 1, 11-12). Дазволіў нявольнікам быць разам з сабою і ўчыніў іх братамі; выкупіў вязняў і зрабіў іх суспадкаемцамі. Але ніхто з вас няхай не кажа: «Якія ж шчаслівыя тыя, хто меў шчасце прыняць Хрыста ў сваім доме!» Не сумуй і не наракай, што жывеш у часы, калі ўжо не можаш убачыць Пана ў целе. Ён не пазбавіў цябе гэтага прывілею: «Тое, што вы зрабілі аднаму з гэтых братоў Маіх меншых, вы Мне зрабілі» (Мц 25, 40).\u003c/p>\n\u003cp style=\"text-align: justify;\">Дарэчы, Марта, шчаслівая праз сваё хвалебнае служэнне, дазволь, што скажу табе: просіш адпачынку як узнагароду за сваю працу. Цяпер ты занятая многімі паслугамі – хочаш падмацаваць смяротныя, хоць святыя целы. Але хутка прыбудзеш ужо ў айчыну. Ці сустрэнеш там вандроўнага, каб прыняць яго? Ці сустрэнеш галоднага, каб накарміць яго? Прагнучага, каб напаіць яго? Хворага, каб адведаць яго? Раз’яднаных, каб паяднаць? Памерлага, каб пахаваць?\u003c/p>\n\u003cp style=\"text-align: justify;\">У айчыне ўжо ўсяго гэтага не будзе. А што будзе? Тое, што выбрала Марыя: там будзем насычаныя, і не будзем сілкавацца. Тое, што Марыя выбрала тут, там будзе дасканалым і поўным. Тут, з застаўленага стала яна збірала крышынкі Божага слова. Хочаш ведаць, як будзе ў небе? Вось жа сам Пан кажа пра сваіх слугаў: «Сапраўды кажу вам, што ён падпяражацца і пасадзіць іх і, падышоўшы, пачне служыць ім» (Лк 12, 37).\u003c/p>\n\u003cp style=\"text-align: justify;\">\u003cspan style=\"color: #ff0000;\">РЭСПАНСОРЫЙ\u003c/span>\u003c/p>\n\u003cp style=\"text-align: justify;\">\u003cspan style=\"color: #ff0000;\">Н.\u003c/span> Калі Езус уваскрасіў Лазара, \u003cspan style=\"color: #ff0000;\">*\u003c/span> наладзілі гасціну ў Бэтаніі.\u003c/p>\n\u003cp style=\"text-align: justify;\">\u003cspan style=\"color: #ff0000;\">К.\u003c/span> А Марыя ўзяла каштоўны алей і намасціла ногі Езуса.\u003c/p>\n\u003cp style=\"text-align: justify;\">\u003cspan style=\"color: #ff0000;\">Н.\u003c/span> Калі.\u003c/p>","afterHtml":"\u003cp style=\"text-align: justify;\">\u003cspan style=\"color: #ff0000;\">Другое чытанне\u003c/span>\u003cbr />Казанне св. Аўгустына, біскупа\u003cbr />\u003cspan style=\"color: #ff0000;\">(Sermo 103, 1-2. 6: PL 38, 613. 615)\u003c/span>\u003c/p>\n\u003cp style=\"text-align: center;\">\u003cem>\u003cspan style=\"color: #ff0000;\">Шчаслівыя, хто меў годнасць запрасіць Пана ў свой дом\u003c/span>\u003c/em>\u003c/p>\n\u003cp style=\"text-align: justify;\">Словы нашага Пана Езуса Хрыста нагадваюць нам, што ёсць толькі адна мэта, да якой мы ідзем сярод разнастайных спраў гэтага свету. Ідзём як вандроўнікі, а не жыхары, як тыя, хто знаходзіцца ў дарозе, а не каля мэты, як тыя, хто прагне, але яшчэ не мае. Аднак ідзем старанна і вытрывала, каб калі-небудзь дайсці да мэты.\u003c/p>\n\u003cp style=\"text-align: justify;\">Марта і Марыя былі сёстрамі. Яднала іх не толькі сваяцтва, але таксама пабожнасць. Абедзве былі адданыя Богу, абедзьве ахвотна служылі Пану, які прабываў у целе. Марыя прыняла Яго так, як звычайна прымалі падарожных. Аднак на самай справе, слуга прыняла Пана, хворая – Лекара, стварэнне – Стварыцеля. Тая, якая павінна была атрымаць дух ле толькі тыя, хто запісаны ў кнізе жыцця Баранка.\u003c/p>\n\u003cp>\u003cspan style=\"color: #ff0000;\">КАРОТКІ РЭСПАНСОРЫЙ\u003c/span>\u003c/p>\n\u003cp>\u003cspan style=\"color: #ff0000;\">К.\u003c/span> Шчаслівыя тыя, хто жыве \u003cspan style=\"color: #ff0000;\">*\u003c/span> ў доме Тваім, Пане.\u003c/p>\n\u003cp>\u003cspan style=\"color: #ff0000;\">Н.\u003c/span> Шчаслівыя.\u003c/p>\n\u003cp>\u003cspan style=\"color: #ff0000;\">К.\u003c/span> Яны вечна будуць Цябе славіць.\u003c/p>\n\u003cp>\u003cspan style=\"color: #ff0000;\">Н.\u003c/span> У доме.\u003c/p>\n\u003cp>\u003cspan style=\"color: #ff0000;\">К.\u003c/span> Хвала Айцу.\u003c/p>\n\u003cp>\u003cspan style=\"color: #ff0000;\">Н.\u003c/span> Шчаслівыя.\u003c/p>","afterHtml":"\u003cp style=\"text-align: justify;\">\u003cspan style=\"color: #ff0000;\">КАРОТКАЕ ЧЫТАННЕ Ап 21, 1а. 2-3, 22. 27\u003c/span>\u003c/p>\n\u003cp style=\"text-align: justify;\">Убачыў я святы горад, новы Ерузалем, які сыходзіў ад Бога з неба, падрыхтаваны, быццам нявеста, прыбраная для свайго жаніха. І пачуў я гучны голас з трона, які казаў: Вось скінія Бога з людзьмі, які будзе жыць з імі; яны будуць Ягоным народам, а Ён будзе Богам з імі. А святыні ў ім я не бачыў, бо святыня ягоная – гэта Пан Бог усемагутны і Баранак. І не ўвойдзе туды нішто нячыстае і той, хто чыніць агіду і падман, але толькі тыя, хто запісаны ў кнізе жыцця Баранка.\u003c/p>\n\u003cp>\u003cspan style=\"color: #ff0000;\">КАРОТКІ РЭСПАНСОРЫЙ\u003c/span>\u003c/p>\n\u003cp>\u003cspan style=\"color: #ff0000;\">К.\u003c/span> Шчаслівыя тыя, хто жыве \u003cspan style=\"color: #ff0000;\">*\u003c/span> ў доме Тваім, Пане.\u003c/p>\n\u003cp>\u003cspan style=\"color: #ff0000;\">Н.\u003c/span> Шчаслівыя.\u003c/p>\n\u003cp>\u003cspan style=\"color: #ff0000;\">К.\u003c/span> Яны вечна будуць Цябе славіць.\u003c/p>\n\u003cp>\u003cspan style=\"color: #ff0000;\">Н.\u003c/span> У доме.\u003c/p>\n\u003cp>\u003cspan style=\"color: #ff0000;\">К.\u003c/span> Хвала Айцу.\u003c/p>\n\
