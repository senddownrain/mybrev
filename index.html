<!DOCTYPE html>
<html lang="be">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  
  <!-- Favicon и иконки -->
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  
  <!-- PWA и установка на iOS + Android -->
  <!-- Манифест будет добавлен автоматически vite-plugin-pwa -->
  <meta id="theme-color" name="theme-color" content="#6B4A32">
  <style>
    /* First paint and the area beneath a translucent mobile status bar.
       Kept in sync with constants/appearance.js by the appearance tests. */
    :root { color-scheme: light; background: #F5F1E8; }
    :root[data-appearance="dark"] { color-scheme: dark; background: #0F0E0C; }
  </style>
  <script>
    // Apply the saved appearance immediately, before Vue finishes loading.
    // This controls the browser/status-bar colour, not the PWA splash screen.
    const savedThemePreference = localStorage.getItem('themePreference') || localStorage.getItem('theme') || 'system'
    const initialTheme = savedThemePreference === 'system'
      && globalThis.matchMedia?.('(prefers-color-scheme: dark)').matches
      ? 'dark'
      : savedThemePreference === 'dark' ? 'dark' : 'light'
    if (initialTheme === 'dark') {
      document.documentElement.dataset.appearance = 'dark'
      document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0F0E0C')
    }
  </script>
  
  <!-- Мета-теги для полноэкранного режима на iOS и Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Малітоўнік">
  
  <!-- Дополнительные мета-теги для PWA -->
  <meta name="application-name" content="Малітоўнік">
  <meta name="description" content="Каталіцкі малітоўнік для штодзённай малітвы">
  <meta name="format-detection" content="telephone=no">
  
  <!-- Open Graph мета-теги для социальных сетей -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Малітоўнік">
  <meta property="og:description" content="Каталіцкі малітоўнік для штодзённай малітвы">
  <meta property="og:site_name" content="Малітоўнік">
  
  <!-- Twitter Card мета-теги -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Малітоўнік">
  <meta name="twitter:description" content="Каталіцкі малітоўнік для штодзённай малітвы">
  
  <!-- Подключение шрифтов -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    // Load the two UI families plus only the reader family selected by the user.
    // This avoids downloading every font offered by the settings screen on startup.
    const savedReaderFont = localStorage.getItem('fontFamily') || ''
    const selectedReaderFont = savedReaderFont.includes('Source Serif 4')
      ? 'Source Serif 4'
      : savedReaderFont.includes('Old Standard TT')
        ? 'Old Standard TT'
        : savedReaderFont.includes('Kurale')
          ? 'Kurale'
          : savedReaderFont.includes('-apple-system')
            ? 'system'
            : 'Literata'
    const readerFontQuery = savedReaderFont.includes('Source Serif 4')
      ? 'family=Source+Serif+4:ital,opsz,wght@0,8..60,300..800;1,8..60,300..800&'
      : savedReaderFont.includes('Old Standard TT')
        ? 'family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&'
        : savedReaderFont.includes('Kurale')
          ? 'family=Kurale&'
          : savedReaderFont.includes('-apple-system')
            ? ''
            : 'family=Literata:ital,opsz,wght@0,7..72,300..800;1,7..72,300..800&'
    const fontStylesheet = document.createElement('link')
    fontStylesheet.rel = 'stylesheet'
    fontStylesheet.dataset.readerFont = selectedReaderFont
    fontStylesheet.href = `https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&${readerFontQuery}family=Source+Sans+3:ital,wght@0,400..800;1,400..800&display=swap`
    document.head.appendChild(fontStylesheet)
  </script>
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=Literata:ital,opsz,wght@0,7..72,300..800;1,7..72,300..800&family=Source+Sans+3:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
  </noscript>
  
  <title>Малітоўнік</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
