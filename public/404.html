<!DOCTYPE html>
<html lang="be">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Старонка не знойдзена — Малітоўнік</title>
    <meta name="theme-color" content="#6B4A32">
    <script>
    const saved = localStorage.getItem('themePreference')
    const legacy = localStorage.getItem('theme')
    const preference = ['system', 'light', 'dark', 'marian'].includes(saved)
      ? saved : ['light', 'dark', 'marian'].includes(legacy) ? legacy : 'system'
    const initialTheme = preference === 'system'
      ? globalThis.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      : preference
    document.documentElement.dataset.appearance = initialTheme
    const statusColors = { light: '#6B4A32', dark: '#0F0E0C', marian: '#244D78' }
    document.querySelector('meta[name="theme-color"]').setAttribute('content', statusColors[initialTheme])
    </script>

    <style media="screen">
      :root {
        color-scheme: light;
        --paper: #F5F1E8; --surface: #FFFBF3; --ink: #2A221B;
        --accent: #6B4A32; --on-accent: #FFF8EE; --muted: #6F6357;
      }
      :root[data-appearance="dark"] {
        color-scheme: dark;
        --paper: #0F0E0C; --surface: #171512; --ink: #F2EBDD;
        --accent: #C9A67B; --on-accent: #281B12; --muted: #B4A89A;
      }
      :root[data-appearance="marian"] {
        color-scheme: light;
        --paper: #F4F8FC; --surface: #FFFFFF; --ink: #202D39;
        --accent: #244D78; --on-accent: #FFFFFF; --muted: #52687A;
      }
      * { box-sizing: border-box; }
      body { background: var(--paper); color: var(--ink); font-family: system-ui, sans-serif; margin: 0; padding: 24px; }
      #message { background: var(--surface); max-width: 420px; margin: 12vh auto; padding: 32px; border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent); border-radius: 24px; box-shadow: 0 18px 46px rgba(61,48,34,.08); }
      #message h2 { color: var(--accent); font-size: 15px; letter-spacing: .12em; margin: 0 0 12px; }
      #message h1 { font-family: Georgia, serif; font-size: 27px; line-height: 1.2; margin: 0 0 16px; }
      #message p { color: var(--muted); line-height: 1.6; margin: 16px 0 24px; }
      #message a { display: block; text-align: center; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 14px; border-radius: 14px; }
      #message a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    </style>
  </head>
  <body>
    <div id="message">
      <h2>404</h2>
      <h1>Старонка не знойдзена</h1>
      <p>Праверце адрас або вярніцеся ў малітоўнік.</p>
      <a href="/">Вярнуцца ў малітоўнік</a>
    </div>
  </body>
</html>
